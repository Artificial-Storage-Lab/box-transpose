<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gomez-Luna: In-Place Matrix Transposition on GPUs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #f8fafc; color: #1e293b;
  font-family: 'Courier New', monospace;

}

header {
  background: #fff; border-bottom: 1px solid #e2e8f0;

}

}

}
#caption .hl-bs { color: #0d9488; font-weight: bold; }

#bar {
  flex: 0 0 auto; height: 52px; background: #fff; border-top: 1px solid #e2e8f0;

}

.btn-rst { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
.btn-rst:hover:not(:disabled) { background: #e2e8f0; }

.t      { font-size: 13px; fill: #1e293b; }
.t-sm   { font-size: 11px; fill: #64748b; }

.t-hd   { font-size: 12px; fill: #94a3b8; letter-spacing: .06em; }
.t-c    { text-anchor: middle; dominant-baseline: middle; }

.t-r    { text-anchor: end; }
.mono-w { fill: #fff; font-weight: bold; }
</style>

<body>

<header>
  <h1>In-Place Matrix Transposition on GPUs
    <span class="sub">Gomez-Luna, Sung, Chang, Gonzalez-Linares, Guil, Hwu &mdash; IEEE TPDS 27(3), 2016</span>
  </h1>
  <nav id="tabs"></nav>
</header>

<svg id="stage" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#c2571a"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1d4ed8"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#94a3b8"/></marker>
  </defs>
  <g id="root"></g>
</svg>

<div id="caption"></div>

<div id="bar">
  <button class="btn btn-rst" id="btnPrev">&#9664; Back</button>
  <button class="btn btn-go"  id="btnNext">Next &#9654;</button>
  <button class="btn btn-rst" id="btnReset">Reset</button>
  <button class="btn btn-alt" id="btnAlt" hidden>Re-run with a skewed schedule</button>
  <div id="dots"></div>
  <span id="where"></span>
</div>

<script>
'use strict';

/* ===================================================================
   Everything numeric on this page comes out of the repo, not out of
   the air:
     - the super-element window and LM_size:  two_dims/gomezluna/decomposition.py
     - the stage sequences 2.1 / 2.2 / 3.1 / 3.2:      the same file
     - k' = k*P mod (PQ-1) and the BS kernel:  two_dims/gomezluna/kernel.cu
     - the PTTWAC claim protocol:              the same file, pttwac_kernel
     - the measured numbers in the last scene: the raw_data jsonl sweeps
   The worked example is what decomposition.plan(12, 10) returns once the
   on-chip budget is scaled down so a plan is small enough to draw. The
   page re-derives the whole thing at load time and asserts it really is a
   transpose -- see the console.
   =================================================================== */

// --- the paper's real constants -------------------------------------
const REAL = {
  MIN: 24,            // their "Min"
  LM: 25344,          // LM_SIZE, in floats
  MAX: 159,           // int(sqrt(25344))
  // decomposition.plan(6203, 6607) -- their own Section 6.2 example
  ex: { M: 6203, N: 6607, Mpad: 6204, Npad: 6608, m: 33, n: 28,
        Mp: 188, Np: 236, seq: '3.2' },
};

// --- the same algorithm, window scaled down so it fits on screen ----
const TOY = {
  MIN: 2, LM: 16, MAX: 4,
  M: 12, N: 10, m: 2, n: 2, Mp: 6, Np: 5, seq: '3.2',
  // decomposition.plan(12, 10)["stages"], as (batch, P, Q, W, mode)
  stages: [
    { batch: 6,  P: 2, Q: 5,  W: 2, mode: 'pttwac' },
    { batch: 30, P: 2, Q: 2,  W: 1, mode: 'bs'     },
    { batch: 1,  P: 6, Q: 10, W: 2, mode: 'pttwac' },
  ],
};

// --- measured, from raw_data/ ---------------------------------------
const MEASURED = {
  rows: 102,                    // rows where both methods reported
  boxWins: 100,
  medianRatio: 6.05,            // gl_apply_ms / box_ms, median
  worst: { shape: '[2,2,2,2,16777216]', perm: '[4,3,0,1,2]',
           tensorMB: 1073.7, glAuxMB: 268.4, glMs: 914.1, boxMs: 145.6,
           contMs: 7.0 },
  boxAuxLo: 8, boxAuxHi: 10880, // bytes
};

// --- colours ---------------------------------------------------------
const C = {
  ink: '#1e293b', mute: '#64748b', faint: '#94a3b8',
  line: '#cbd5e1', hair: '#e2e8f0', panel: '#fff',
  blue: '#1d4ed8', blueF: '#dbeafe',
  teal: '#0d9488', tealF: '#ccfbf1',
  amber: '#b45309', amberF: '#fef3c7',
  rose: '#e11d48', roseF: '#ffe4e6',
  orange: '#c2571a', orangeF: '#ffedd5',
  violet: '#7c3aed', violetF: '#ede9fe',
  slateF: '#f1f5f9', bgSolid: '#f8fafc',
};
// one colour per cycle, reused across scenes
const CYC = [
  { s: '#1d4ed8', f: '#dbeafe' },
  { s: '#c2571a', f: '#ffedd5' },
  { s: '#0d9488', f: '#ccfbf1' },
  { s: '#7c3aed', f: '#ede9fe' },
  { s: '#be185d', f: '#fce7f3' },
];
const FIXED = { s: '#94a3b8', f: '#f1f5f9' };

// ====================================================================
//  tiny svg helpers
// ====================================================================
const NS = 'http://www.w3.org/2000/svg';
let g = null;                                   // current draw target

function E(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs || {})) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  g.appendChild(e);
  return e;
}
function box(x, y, w, h, o) {
  o = o || {};
  return E('rect', { x, y, width: w, height: h, rx: o.rx == null ? 3 : o.rx,
    fill: o.fill || C.panel, stroke: o.stroke || C.line,
    'stroke-width': o.sw || 1, opacity: o.op, 'stroke-dasharray': o.dash });
}
function T(x, y, s, o) {
  o = o || {};
  const cls = ['t' + (o.size ? '-' + o.size : ''), o.c ? 't-c' : '',
               o.b ? 't-b' : '', o.r ? 't-r' : ''].filter(Boolean).join(' ');
  return E('text', { x, y, class: cls, fill: o.fill }, s);
}
function line(x1, y1, x2, y2, o) {
  o = o || {};
  return E('line', { x1, y1, x2, y2, stroke: o.stroke || C.line,
    'stroke-width': o.sw || 1, 'stroke-dasharray': o.dash,
    'marker-end': o.arrow, opacity: o.op });
}
function path(d, o) {
  o = o || {};
  return E('path', { d, fill: o.fill || 'none', stroke: o.stroke || C.line,
    'stroke-width': o.sw || 1, 'marker-end': o.arrow,
    'stroke-dasharray': o.dash, opacity: o.op });
}
// a labelled cell: rect + centred text
function cell(x, y, w, h, label, o) {
  o = o || {};
  box(x, y, w, h, o);
  if (label != null && label !== '')
    T(x + w / 2, y + h / 2 + 0.5, label,
      { c: 1, size: o.tsize, fill: o.tfill || C.ink, b: o.tb });
}
function heading(x, y, s) { T(x, y, s, { size: 'hd' }); }
function panel(x, y, w, h, title) {
  box(x, y, w, h, { fill: C.panel, stroke: C.hair, rx: 6 });
  if (title) heading(x + 12, y + 19, title);
}
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ====================================================================
//  the algorithm itself, re-derived here
// ====================================================================

// kernel.cu: k' = k*P mod L for k < L, and L -> L. L = P*Q - 1.
function dest(k, P, Q) { const L = P * Q - 1; return k === L ? L : (k * P) % L; }

function cyclesOf(P, Q) {
  const PQ = P * Q, seen = new Array(PQ).fill(false), out = [];
  for (let s = 0; s < PQ; s++) {
    if (seen[s]) continue;
    const c = []; let k = s;
    while (!seen[k]) { seen[k] = true; c.push(k); k = dest(k, P, Q); }
    out.push(c);
  }
  return out;
}

// one stage: view the flat array as [batch, P, Q, W], swap P and Q.
function applyStage(flat, st) {
  const { batch: b, P, Q, W } = st, out = new Array(flat.length);
  for (let i = 0; i < b; i++)
    for (let p = 0; p < P; p++)
      for (let q = 0; q < Q; q++)
        for (let w = 0; w < W; w++)
          out[((i * Q + q) * P + p) * W + w] = flat[((i * P + p) * Q + q) * W + w];
  return out;
}

// The page checks its own worked example on load. `layouts[s][k]` is the
// ORIGINAL linear index living in memory slot k after s stages.
const LAYOUTS = (() => {
  const n = TOY.M * TOY.N;
  let cur = Array.from({ length: n }, (_, i) => i);
  const out = [cur];
  for (const st of TOY.stages) { cur = applyStage(cur, st); out.push(cur); }
  return out;
})();
(() => {
  const { M, N } = TOY, fin = LAYOUTS[LAYOUTS.length - 1];
  let ok = true;
  // final slot (j, i) of an N x M matrix must hold original (i, j) = i*N + j
  for (let j = 0; j < N; j++) for (let i = 0; i < M; i++)
    if (fin[j * M + i] !== i * N + j) ok = false;
  console.assert(ok, 'the three stages do not compose to a transpose -- ' +
                     'this page is out of step with two_dims/gomezluna/decomposition.py');
  if (ok) console.log('gomez-luna page: stage sequence ' + TOY.seq +
                      ' verified as a ' + M + 'x' + N + ' transpose');
})();

// ====================================================================
//  SCENE 1 -- why an in-place transpose is hard
// ====================================================================
const S1 = { P: 3, Q: 5 };
S1.L = S1.P * S1.Q - 1;
S1.walk = [1, 3, 9, 13, 11, 5];          // the cycle we animate, in order
S1.cycles = cyclesOf(S1.P, S1.Q);

function s1_cycleIndex(k) {
  for (let i = 0; i < S1.cycles.length; i++) if (S1.cycles[i].includes(k)) return i;
  return -1;
}
function s1_colour(k, lit) {
  const c = S1.cycles[s1_cycleIndex(k)];
  if (!lit) return { fill: C.panel, stroke: C.line };
  if (c.length === 1) return { fill: FIXED.f, stroke: FIXED.s };
  const nt = S1.cycles.filter(x => x.length > 1);
  const i = nt.findIndex(x => x === c);
  return { fill: CYC[i % CYC.length].f, stroke: CYC[i % CYC.length].s };
}

// memory strip geometry
const S1G = { x: 372, y: 292, w: 52, h: 44 };
const s1x = k => S1G.x + k * S1G.w;

function s1_strip(state, lit) {
  const { x, y, w, h } = S1G;
  T(x, y + h + 40, 'MEMORY — ONE ARRAY, NOWHERE ELSE TO PUT ANYTHING', { size: 'hd' });
  for (let k = 0; k <= S1.L; k++) {
    const col = s1_colour(k, lit);
    const v = state ? state[k] : k;
    cell(s1x(k), y, w - 6, h, v == null ? '' : String(v),
         { fill: col.fill, stroke: col.stroke, tb: 1 });
    T(s1x(k) + (w - 6) / 2, y + h + 15, String(k), { c: 1, size: 'xs' });
  }
  T(x - 12, y + h + 15, 'slot', { r: 1, size: 'xs' });
}

function s1_matrix(x, y, rows, cols, cw, get, title) {
  T(x, y - 12, title, { size: 'sm' });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    cell(x + c * cw, y + r * cw, cw - 3, cw - 3, String(get(r, c)),
         { fill: C.panel, stroke: C.line, tsize: 'sm' });
}

const SCENE1 = {
  id: 'why', tab: '1 . Why it is hard',
  steps: [
    { cap: '<b>Out of place is the easy case.</b> Read from A, write to B, every ' +
           'element straight to its home. Perfectly parallel. The price is B itself ' +
           '&mdash; a second buffer the same size as the first. That is the cost the ' +
           'whole line of work exists to avoid.' },
    { cap: 'In place there is <b>only one array</b>. A non-square transpose is then a ' +
           'permutation of linear positions: slot <code>k</code> must end up at ' +
           '<code>k&middot;P mod (PQ&minus;1)</code>, with the two end slots staying put. ' +
           'Here <code>P=3, Q=5</code>, so <code>L=14</code> and <code>k&rsquo; = 3k mod 14</code>. ' +
           'That formula is Equation (1) of the paper, and it is literally the line in ' +
           '<code>bs_kernel</code>.' },
    { cap: '<b>It is not a set of swaps.</b> Slot 1 goes to slot 3 &mdash; but slot 3 does ' +
           'not come back to 1, it goes to 9. So you cannot exchange pairs. Writing into ' +
           'slot 3 destroys what was there, so you have to be holding it when you do.' },
    { cap: 'Pick up slot 1. Now you are holding a value and slot 1 is free.' },
    { cap: 'Put it where it belongs, in slot 3, and catch what was there. You are still ' +
           'holding exactly one value. That is all the scratch space this needs: ' +
           '<b>one register</b>.' },
    { cap: 'Keep going. 3 belongs in 9.' },
    { cap: '9 belongs in 13.' },
    { cap: '13 belongs in 11.' },
    { cap: '11 belongs in 5.' },
    { cap: 'And 5 belongs back in slot 1, which has been empty since we started. The loop ' +
           'closes. That loop is a <b>cycle</b>, and walking it is cycle following.' },
    { cap: 'The permutation is nothing but cycles. Fifteen slots here make five of them: ' +
           'three fixed points that never move, and two of length six. Each cycle is ' +
           'strictly sequential &mdash; you cannot start step two before step one &mdash; ' +
           'so <b>the number of cycles is your parallelism</b>.' },
    { cap: 'And that is the whole problem. A 4096&times;3000 matrix is 12,288,000 elements ' +
           'and <b>exactly 4 cycles</b>. Four. On a GPU with thousands of cores. ' +
           'Gomez-Luna\'s answer is not a cleverer cycle walk &mdash; it is to reshape the ' +
           'problem so that most of the work never touches a global cycle at all.' },
  ],
  draw(i, p) {
    if (i === 0) {
      panel(60, 60, 1080, 400);
      heading(80, 92, 'OUT OF PLACE');
      s1_matrix(120, 150, 3, 5, 52, (r, c) => r * 5 + c, 'A  (3 x 5)');
      const arrX = 460;
      path(`M ${arrX} 216 L ${arrX + 90} 216`, { stroke: C.blue, sw: 2, arrow: 'url(#arrB)' });
      T(arrX + 45, 200, 'copy', { c: 1, size: 'sm', fill: C.blue });
      s1_matrix(600, 150, 5, 3, 52, (r, c) => c * 5 + r, 'B  (5 x 3)  — a whole new allocation');
      box(600, 150, 3 * 52 - 3, 5 * 52 - 3, { fill: C.roseF, stroke: C.rose, op: .35, sw: 2 });
      T(840, 200, 'second buffer, same size as A', { size: 'sm', fill: C.rose });
      T(840, 222, 'a 1 GB tensor needs another 1 GB', { size: 'sm', fill: C.rose });
      T(840, 258, 'PyTorch .contiguous() is this,', { size: 'sm' });
      T(840, 278, 'and it is very fast.', { size: 'sm' });
      T(840, 306, 'Every in-place method on this', { size: 'sm', fill: C.mute });
      T(840, 324, 'page is trading time for that', { size: 'sm', fill: C.mute });
      T(840, 342, 'pink rectangle.', { size: 'sm', fill: C.mute });
      return;
    }

    if (i === 11) { SCENE1.ceiling(p); return; }

    // --- the memory strip is the stage from here on ---
    const lit = i >= 10;
    let state = null, hand = null, handAt = null, handTo = null;

    if (i >= 3 && i <= 9) {
      // replay the walk up to this beat
      state = Array.from({ length: 15 }, (_, k) => k);
      const beat = i - 3;                    // 0 = pick up, 1..6 = writes
      hand = state[S1.walk[0]]; state[S1.walk[0]] = null; handAt = S1.walk[0];
      for (let b = 1; b <= beat; b++) {
        const to = S1.walk[b % S1.walk.length];
        const caught = state[to];
        state[to] = hand; hand = caught; handAt = to;
      }
      handTo = beat < 6 ? S1.walk[(beat + 1) % S1.walk.length] : null;
      if (beat === 6) hand = null;
    }

    T(60, 84, i === 1 || i === 2 ? 'the 3 x 5 matrix, and the one array it lives in'
                                 : 'walking one cycle', { size: 'sm', fill: C.faint });

    // the little matrix, for orientation -- kept clear of the strip and the
    // flying chip by sitting entirely to the left of S1G.x.
    s1_matrix(90, 190, 3, 5, 44, (r, c) => r * 5 + c, 'logical 3 x 5');
    T(90, 342, 'row-major:  slot k = row × 5 + col', { size: 'xs' });

    // destination map, drawn as arcs over the strip
    if (i === 1 || i === 2) {
      const show = i === 1 ? [0, 1, 2, 3, 6, 7, 14] : [1, 3, 9];
      for (const k of show) {
        const d = dest(k, S1.P, S1.Q);
        const x1 = s1x(k) + (S1G.w - 6) / 2, x2 = s1x(d) + (S1G.w - 6) / 2;
        const r = Math.abs(x2 - x1) / 2;
        const lit2 = i === 2 && (k === 1 || k === 3);
        if (k === d) {
          T(x1, S1G.y - 14, 'stays', { c: 1, size: 'xs', fill: FIXED.s });
        } else {
          path(`M ${x1} ${S1G.y - 6} A ${r} ${Math.min(r * .75, 90)} 0 0 ${x2 > x1 ? 1 : 0} ${x2} ${S1G.y - 6}`,
               { stroke: lit2 ? C.orange : (i === 2 ? C.hair : C.faint),
                 sw: lit2 ? 2.2 : 1, arrow: lit2 ? 'url(#arr)' : 'url(#arrG)' });
        }
      }
      T(770, 120, 'k’ = 3k mod 14    (and 14 → 14)',
        { c: 1, b: 1, fill: C.orange });
      if (i === 2) {
        T(770, 148, '1 → 3,  but  3 → 9.  Not a swap.',
          { c: 1, size: 'sm', fill: C.orange });
      }
    }

    s1_strip(state, lit);

    // the value in hand, flying
    if (i >= 3 && i <= 9 && hand != null) {
      const cw = S1G.w - 6, hy = S1G.y - 74;
      // where it is coming from / going to
      const fromK = i === 3 ? S1.walk[0] : S1.walk[(i - 4) % S1.walk.length];
      const toK = handAt;
      const x = lerp(s1x(fromK), s1x(toK), ease(p));
      const lift = Math.sin(Math.PI * ease(p)) * 16;
      cell(x, hy - lift, cw, 40, String(hand),
           { fill: C.amberF, stroke: C.amber, sw: 2, tb: 1, tfill: C.amber });
      T(x + cw / 2, hy - lift - 14, 'in hand', { c: 1, size: 'xs', fill: C.amber });
      if (handTo != null) {
        const tx = s1x(handTo) + cw / 2;
        path(`M ${x + cw / 2} ${hy - lift + 44} L ${tx} ${S1G.y - 8}`,
             { stroke: C.amber, sw: 1.4, dash: '4 3', arrow: 'url(#arr)', op: .6 });
      }
      // the empty slot we will close back onto
      const hole = s1x(S1.walk[0]) + cw / 2;
      if (i < 9) T(hole, S1G.y + S1G.h + 34, 'empty', { c: 1, size: 'xs', fill: C.amber });
    }

    if (i === 10) {
      // cycle summary
      let y = 130;
      T(90, 108, 'the cycles of  k’ = 3k mod 14', { size: 'sm', b: 1 });
      for (const c of S1.cycles) {
        const col = s1_colour(c[0], true);
        box(90, y - 11, 14, 14, { fill: col.fill, stroke: col.stroke, rx: 2 });
        T(114, y, (c.length === 1 ? 'fixed point · ' : 'length ' + c.length + ' · ') +

function factorsOf(n) {
  const f = [];
  for (let d = 1; d * d <= n; d++) if (n % d === 0) { f.push(d); if (d !== n / d) f.push(n / d); }
  return f.sort((a, b) => a - b);
}

function s2_factorLine(x, y, w, n, min, max, label, picked) {
  const f = factorsOf(n);
  T(x, y - 26, label, { size: 'sm', b: 1 });
  // the window
  const cw = 46, gap = 8;
  const total = f.length * (cw + gap) - gap;
  const sx = x + Math.max(0, (w - total) / 2);
  f.forEach((v, k) => {
    const inWin = v >= min && v < max;
    const isPick = v === picked;
    cell(sx + k * (cw + gap), y, cw, 34, String(v), {
      fill: isPick ? C.tealF : (inWin ? C.blueF : C.slateF),
      stroke: isPick ? C.teal : (inWin ? C.blue : C.line),
      sw: isPick ? 2.2 : 1, tb: isPick,
      tfill: isPick ? C.teal : (inWin ? C.blue : C.faint), tsize: 'sm',
    });
    if (isPick) T(sx + k * (cw + gap) + cw / 2, y + 52, 'smallest', { c: 1, size: 'xs', fill: C.teal });
  });
  return { sx, cw, gap, f };
}

// Simulate pttwac_kernel exactly: load start, check start claimed, then loop
// { read nxt, claim nxt, if already claimed break, write, advance }.
function pttwacRun(schedule) {
  const { P, Q, W, PQ, L } = S5;
  const data = Array.from({ length: PQ }, (_, k) => k);
  const done = new Array(PQ).fill(0);
  const blocks = {};
  for (let s = 0; s < PQ; s++) {
    if (s === 0 || s === L) continue;
    const nx = (s * P) % L;
    if (nx === s) continue;
    blocks[s] = { r1: data[s], nxt: nx, alive: true, wrote: [] };
  }
  const frames = [{ data: data.slice(), done: done.slice(),
                    blocks: JSON.parse(JSON.stringify(blocks)), ev: [] }];
  for (const order of schedule) {
    const ev = [];
    for (const s of order) {
      const b = blocks[s];
      if (!b || !b.alive) continue;
      const nxt = b.nxt, r2 = data[nxt];
      if (done[nxt]) { b.alive = false; ev.push({ s, nxt, kind: 'quit' }); continue; }
      done[nxt] = 1; data[nxt] = b.r1; b.r1 = r2; b.wrote.push(nxt);
      b.nxt = nxt === L ? L : (nxt * P) % L;
      ev.push({ s, nxt, kind: 'wrote' });
    }
    frames.push({ data: data.slice(), done: done.slice(),
                  blocks: JSON.parse(JSON.stringify(blocks)), ev });
    if (!Object.values(blocks).some(b => b.alive)) break;
  }
  // check
  const want = new Array(PQ);
  for (let k = 0; k < PQ; k++) want[dest(k, P, Q)] = k;
  frames.ok = data.every((v, k) => v === want[k]);
  return frames;
}

        ['cases where both methods reported', String(MEASURED.rows)],
        ['box transpose faster', MEASURED.boxWins + ' of ' + MEASURED.rows],
        ['median  gl_apply_ms / box_ms', MEASURED.medianRatio + ' ×'],
      ];
      st.forEach((r, k) => {
        const y = 322 + k * 34;
        T(88, y, r[0], { size: 'sm', fill: C.mute });
        T(1112, y, r[1], { size: 'sm', r: 1, b: 1, fill: k ? C.blue : C.ink });
      });
      T(88, 430, 'experiments/hard_perms + experiments/dpost_sweep, RTX 2070.', { size: 'xs' });
      return;
    }
    if (i === 1) {
      panel(60, 56, 1080, 400, 'PADDING');
      const bars = [
        { l: '2-D, their example  (6203 × 6607)', v: 0.0003, note: '+12,811 elements — 0.03%', c: C.teal },
        { l: 'N-D worst documented case', v: 36, note: '20 GB tensor → 720 GB request (guarded, never run)', c: C.rose },
      ];
      bars.forEach((b, k) => {
        const y = 120 + k * 130;
        T(88, y, b.l, { size: 'sm', b: 1 });
        box(88, y + 14, 1000, 34, { fill: C.slateF, stroke: C.hair, rx: 4 });
        const w = Math.max(3, Math.min(1000, Math.log10(1 + b.v * 30) / Math.log10(1 + 36 * 30) * 1000)) * ease(p);
        box(88, y + 14, w, 34, { fill: k ? C.roseF : C.tealF, stroke: b.c, sw: 1.6, rx: 4 });
        T(88, y + 72, b.note, { size: 'sm', fill: b.c });
      });
      T(88, 384, 'log scale. Algorithm 5 pads each dimension independently and unconditionally;', { size: 'sm', fill: C.mute });
      T(88, 406, 'in N-D the swap network can revisit an axis, and each visit pads again.', { size: 'sm', fill: C.mute });
      T(88, 436, 'n_dims/gomezluna/decomposition.py  ·  MAX_PAD_ELEMENTS', { size: 'xs' });
      return;
    }
    if (i === 2) {
      panel(60, 56, 1080, 400, 'AUXILIARY MEMORY — THE WORST CASE IN raw_data/');
      T(88, 100, 'shape ' + MEASURED.worst.shape + '  ·  perm ' + MEASURED.worst.perm,
        { size: 'sm' });
      const scale = 1073.7, x0 = 88, W = 1000;
      const bars = [
        { l: 'the tensor itself', v: MEASURED.worst.tensorMB, c: C.faint, f: C.slateF, t: '1073.7 MB' },
        { l: 'Gomez-Luna claim bitmap', v: MEASURED.worst.glAuxMB, c: C.orange, f: C.orangeF, t: '268.4 MB' },
        { l: 'box transpose cycle arrays', v: MEASURED.boxAuxHi / 1e6, c: C.blue, f: C.blueF, t: '≤ 10.9 kB' },
      ];
      bars.forEach((b, k) => {
        const y = 140 + k * 74;
        T(88, y, b.l, { size: 'sm', b: 1 });
        box(x0, y + 12, W, 30, { fill: C.panel, stroke: C.hair, rx: 4 });
        const w = Math.max(2, b.v / scale * W) * ease(p);
        box(x0, y + 12, w, 30, { fill: b.f, stroke: b.c, sw: 1.6, rx: 4 });
        const wide = w > W - 130;
        T(wide ? x0 + w - 12 : x0 + Math.max(w + 12, 60), y + 31, b.t,
          { size: 'sm', b: 1, fill: b.c, r: wide });
      });
      line(88, 372, 1088, 372, { stroke: C.hair });
      T(88, 400, 'runtime on this case:', { size: 'sm', fill: C.mute });
      const t = [['Gomez-Luna', MEASURED.worst.glMs + ' ms', C.orange],
                 ['box transpose', MEASURED.worst.boxMs + ' ms', C.blue],
                 ['.contiguous()', MEASURED.worst.contMs + ' ms  (+1 GB)', C.faint]];
      t.forEach((r, k) => {
        T(330 + k * 270, 400, r[0], { size: 'sm', fill: r[2] });
        T(330 + k * 270, 424, r[1], { size: 'sm', b: 1, fill: r[2] });
      });
      T(88, 448, 'bitmap is zeroed before every stage, so it is paid per stage, not once.', { size: 'xs' });

    // i === 3
    panel(60, 56, 530, 400, 'GOMEZ-LUNA');
    const a = [
      ['decomposition', 'four fixed templates (2.1, 2.2, 3.1, 3.2)'],

    panel(610, 56, 530, 400, 'BOX TRANSPOSE');
    const b2 = [
      ['decomposition', 'adjacent box swaps — the same primitive'],

      ['runs a swap with', 'direct cycle following, one register'],
      ['parallelism from', 'D_pre × cycles × D_post — the other axes'],

      ['aux memory', 'cycle start/length arrays (kB)'],
      ['rank', 'N-D natively'],
    ];
    b2.forEach((r, k) => {
      const y = 100 + k * 50, hot = k === 3 || k === 5;

    });
    T(600, 486, 'Both skip fixed points differently: box transpose skips gcd(rows−1, cols−1)+1 cells outright.',
      { c: 1, size: 'xs' });
  },
};

// ====================================================================
//  driver
// ====================================================================
const SCENES = [SCENE1, SCENE2, SCENE3, SCENE4, SCENE5, SCENE6];
const state = { scene: 0, step: 0, p: 1, mode: 'lock' };

const svg = document.getElementById('stage');
const root = document.getElementById('root');
const capEl = document.getElementById('caption');
const tabsEl = document.getElementById('tabs');
const dotsEl = document.getElementById('dots');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');
const btnAlt = document.getElementById('btnAlt');
const whereEl = document.getElementById('where');

SCENES.forEach((s, k) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = s.tab;
  b.onclick = () => { state.scene = k; state.step = 0; state.mode = 'lock';
                      if (s.onEnter) s.onEnter(0, 1); animate(); };
  tabsEl.appendChild(b);
});

function render() {
  const sc = SCENES[state.scene];
  while (root.firstChild) root.removeChild(root.firstChild);
  g = root;
  sc.draw(state.step, state.p, state.mode);

  capEl.innerHTML = sc.capFor ? sc.capFor(state.step, state.mode)
                              : sc.steps[state.step].cap;

  [...tabsEl.children].forEach((b, k) => b.classList.toggle('on', k === state.scene));
  while (dotsEl.firstChild) dotsEl.removeChild(dotsEl.firstChild);
  sc.steps.forEach((_, k) => {
    const d = document.createElement('span');
    d.className = 'dot' + (k === state.step ? ' on' : k < state.step ? ' past' : '');
    dotsEl.appendChild(d);
  });

  const sub = sc.stepsInStep ? sc.stepsInStep(state.step, state.mode) : 1;
  const atEnd = state.scene === SCENES.length - 1 &&
                state.step === sc.steps.length - 1 &&
                (sub === 1 || (SCENE5._tick || 1) >= sub);
  btnPrev.disabled = state.scene === 0 && state.step === 0;
  btnNext.disabled = atEnd;
  btnAlt.hidden = !(sc === SCENE5 && state.step >= 3);
  btnAlt.textContent = state.mode === 'skew' ? 'Back to the lockstep schedule'
                                             : 'Re-run with a skewed schedule';
  whereEl.textContent = sc.tab.replace(/^\d+ \. /, '') +
    '   —   step ' + (state.step + 1) + ' / ' + sc.steps.length;
}

let raf = null;
function animate(dur) {
  if (raf) cancelAnimationFrame(raf);
  const t0 = performance.now(), D = dur == null ? 460 : dur;
  const tick = now => {
    state.p = Math.min(1, (now - t0) / D);
    render();
    if (state.p < 1) raf = requestAnimationFrame(tick); else raf = null;
  };
  raf = requestAnimationFrame(tick);
}

function go(dir) {
  const sc = SCENES[state.scene];
  const sub = sc.stepsInStep ? sc.stepsInStep(state.step, state.mode) : 1;
  // sub-steps inside a step (the PTTWAC ticks)
  if (sub > 1) {
    const t = SCENE5._tick || 1;
    if (dir > 0 && t < sub) { SCENE5._tick = t + 1; animate(320); return; }
    if (dir < 0 && t > 1)   { SCENE5._tick = t - 1; animate(320); return; }
  }
  let ns = state.scene, st = state.step + dir;
  if (st < 0) { ns--; if (ns < 0) return; st = SCENES[ns].steps.length - 1; }
  if (st >= SCENES[ns].steps.length) { ns++; if (ns >= SCENES.length) return; st = 0; }
  state.scene = ns; state.step = st;
  const nsc = SCENES[ns];
  if (nsc.onEnter) nsc.onEnter(st, dir);
  animate();
}

btnNext.onclick = () => go(1);
btnPrev.onclick = () => go(-1);
btnReset.onclick = () => { state.step = 0; state.mode = 'lock';
                           if (SCENES[state.scene].onEnter) SCENES[state.scene].onEnter(0, 1);
                           animate(); };
btnAlt.onclick = () => { state.mode = state.mode === 'skew' ? 'lock' : 'skew';
                         SCENE5._tick = RUN[state.mode === 'skew' ? 'skew' : 'lock'].length - 1;
                         animate(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

animate(1);
</script>
